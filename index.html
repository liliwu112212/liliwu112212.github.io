这是为您定制的商品浏览页面，它拥有更醒目的商品展示区，并实现了后台更新与前台浏览完全同步的功能。分享给好友的链接只会显示纯净的浏览页，不包含任何管理工具。
```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>悦选商城 | 发现心仪好物</title>
    <!-- 优雅字体 & 图标库 (仅用于后台管理图标，前台不显示分享图标) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f6fa;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 24px 20px 56px;
            color: #1a2c3e;
        }

        /* 整体容器 */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========= 前台浏览样式 (好友看到的部分，不包含分享按钮) ========= */
        .shop-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .shop-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #1e4668, #2d6a9f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .shop-header p {
            color: #5f7f9e;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* 搜索 + 筛选条 (前台简约) */
        .toolbar-front {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: white;
            padding: 12px 20px;
            border-radius: 60px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.03);
            margin-bottom: 32px;
            border: 1px solid #eef2f8;
        }
        .search-area {
            flex: 2;
            display: flex;
            align-items: center;
            background: #f1f4f9;
            border-radius: 48px;
            padding: 8px 20px;
            gap: 10px;
        }
        .search-area i {
            color: #8aa0bc;
            font-size: 1rem;
        }
        .search-area input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
            font-weight: 400;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: white;
            border: 1px solid #dce5ef;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #2c4c6e;
        }
        .filter-chip.active {
            background: #1e4668;
            border-color: #1e4668;
            color: white;
            box-shadow: 0 4px 8px rgba(30,70,104,0.15);
        }
        .filter-chip:hover:not(.active) {
            background: #eef2ff;
        }

        /* 商品网格 - 图片更大更突出 */
        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-top: 12px;
        }

        /* 卡片设计：大图区占比更多 */
        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
            border: 1px solid #edf2f7;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.12);
        }

        /* 图片区域更大 (aspect-ratio 1.1让图片更高) */
        .card-img-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;  /* 正方形大图区域，图片占满 */
            background: #fafcff;
            overflow: hidden;
        }
        .card-img-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover .card-img-area img {
            transform: scale(1.02);
        }

        /* 角标 */
        .badge-stack {
            position: absolute;
            top: 14px;
            left: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 2;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            letter-spacing: 0.3px;
        }
        .badge.hot { background: #e26d3c; }
        .badge.new { background: #2d8f6e; }
        .badge.discount { background: #d93838; }

        .card-info {
            padding: 18px 16px 20px;
        }
        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 8px;
            color: #0f2b3f;
        }
        .price-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0 6px;
        }
        .current-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: #c7362b;
            letter-spacing: -0.3px;
        }
        .old-price {
            font-size: 0.85rem;
            color: #8dabca;
            text-decoration: line-through;
        }
        .product-desc {
            font-size: 0.85rem;
            color: #5b7a9a;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 8px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            background: white;
            border-radius: 48px;
            color: #99b2cf;
        }

        /* ========= 后台管理区域 (仅供管理员操作，分享链接绝对不可见) ========= */
        .admin-panel {
            margin-top: 60px;
            background: white;
            border-radius: 36px;
            padding: 28px 30px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid #eaf0f6;
        }
        .admin-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid #eef3fc;
            padding-bottom: 16px;
        }
        .admin-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e3e64;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #5d7b9c;
            letter-spacing: 0.5px;
        }
        .field input, .field textarea, .field select {
            padding: 12px 14px;
            border-radius: 20px;
            border: 1.5px solid #e2ebf5;
            font-family: inherit;
            font-size: 0.9rem;
            transition: 0.2s;
            background: #fefefe;
        }
        .field input:focus, .field textarea:focus {
            border-color: #2d6a9f;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45,106,159,0.1);
        }
        .tag-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .tag-group label {
            font-weight: normal;
            text-transform: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        button {
            background: #1f5e8e;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        button:hover {
            background: #134871;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #6c8eae;
        }
        .btn-secondary:hover {
            background: #54728f;
        }
        .btn-danger {
            background: #c24141;
        }
        .product-list-admin {
            margin-top: 28px;
            border-top: 1px solid #eef2fa;
            padding-top: 20px;
        }
        .admin-item {
            background: #fafdff;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e9f0f5;
        }
        .admin-item-info strong {
            font-size: 0.95rem;
        }
        .admin-actions {
            display: flex;
            gap: 8px;
        }
        .admin-actions button {
            padding: 6px 16px;
            font-size: 0.75rem;
        }
        .stat-badge {
            background: #ecf3fa;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1f4a72;
            font-weight: 500;
        }
        hr {
            margin: 20px 0;
            border-color: #eaf0f6;
        }
        @media (max-width: 720px) {
            body { padding: 16px 12px; }
            .goods-grid { gap: 18px; }
            .current-price { font-size: 1.4rem; }
            .product-title { font-size: 1rem; }
        }
        .notice {
            background: #eaf5ff;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            color: #2b6a9e;
        }
        i.fa, i.far, i.fas {
            margin-right: 4px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 前台浏览区域（好友看到的界面: 无任何QQ/微信分享按钮） -->
    <div class="shop-header">
        <h1>✨ 悦选好物</h1>
        <p>甄选品质 · 灵感生活</p>
    </div>
    <div class="toolbar-front">
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="frontSearch" placeholder="搜索商品名称或简介...">
        </div>
        <div class="filter-buttons" id="filterGroupFront">
            <button data-filter="all" class="filter-chip active">全部</button>
            <button data-filter="hot" class="filter-chip">🔥 热销</button>
            <button data-filter="new" class="filter-chip">✨ 新品</button>
            <button data-filter="discount" class="filter-chip">🏷️ 折扣</button>
        </div>
    </div>
    <div class="goods-grid" id="goodsGridFront">
        <!-- 动态商品卡片 -->
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载好物中...</div>
    </div>

    <!-- 管理后台面板 (只有管理员能看到，完全独立；好友分享的页面滚动也不会出现任何社交按钮) -->
    <div class="admin-panel" id="adminZone">
        <div class="admin-header">
            <i class="fas fa-crown" style="font-size: 28px; color:#d4af37;"></i>
            <h2>后台管理中心 · 即时更新</h2>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <div class="stat-badge" id="statDisplay">📦 加载统计...</div>
            <small style="color:#6b8fae;"><i class="fas fa-sync-alt"></i> 修改商品后好友所见内容实时同步</small>
        </div>

        <form id="productManageForm">
            <div class="form-grid">
                <div class="field">
                    <label>商品名称 *</label>
                    <input type="text" id="prodName" placeholder="例：极简羊毛大衣" required>
                </div>
                <div class="field">
                    <label>售价 (¥) *</label>
                    <input type="number" id="prodPrice" step="0.01" placeholder="189.00" required>
                </div>
                <div class="field">
                    <label>原价 (¥) (选填)</label>
                    <input type="number" id="prodOldPrice" step="0.01" placeholder="299.00">
                </div>
                <div class="field">
                    <label>图片URL</label>
                    <input type="text" id="prodImg" placeholder="https://picsum.photos/id/101/400/400">
                </div>
                <div class="field">
                    <label>简介</label>
                    <textarea id="prodDesc" rows="2" placeholder="柔软舒适，秋冬质感..."></textarea>
                </div>
                <div class="field">
                    <label>商品标识 (可多选)</label>
                    <div class="tag-group">
                        <label><input type="checkbox" id="prodHot"> 🔥 热销品</label>
                        <label><input type="checkbox" id="prodNew"> ✨ 新品</label>
                        <label><input type="checkbox" id="prodDiscountFlag"> 🏷️ 折扣标签</label>
                    </div>
                    <small>折扣标签 + 原价比售价高都会展示折扣角标</small>
                </div>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end;">
                <button type="submit" id="saveProductBtn"><i class="fas fa-save"></i> 添加 / 更新商品</button>
                <button type="button" id="clearFormBtn" class="btn-secondary"><i class="fas fa-eraser"></i> 清空表单</button>
            </div>
        </form>

        <div class="product-list-admin">
            <h3 style="font-size: 1.1rem; margin-bottom: 14px;"><i class="fas fa-list-ul"></i> 所有商品 (管理编辑/删除)</h3>
            <div id="adminProductList">
                <!-- 动态商品管理列表 -->
            </div>
        </div>
        <div class="notice">
            <i class="fas fa-share-alt"></i> 重要提示：好友通过链接进入只会看到上方商品展示区，无管理工具 & 无社交分享按钮。您在后台的每一次增删改，好友刷新页面即看到最新内容。
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 后端数据模拟 (使用 LocalStorage 持久化，所有访客读取统一数据)
    // 实现「后台更新商品，好友看到的浏览页也立即更新」
    // 完全移除商品卡片下的QQ/微信分享按钮，满足要求。
    // 图片更大（卡片图区1:1 大图展示）
    // --------------------------------------------------------------
    
    let productsDatabase = [];    // 商品数组
    let currentEditId = null;     // 编辑中的商品id
    let frontFilter = "all";
    let frontKeyword = "";

    // ---------- 初始化默认商品 ----------
    function initDefaultProducts() {
        return [
            {
                id: "prod_1001",
                name: "复古羊毛混纺大衣",
                price: 389.0,
                oldPrice: 799.0,
                desc: "双面呢料，挺括版型，都市通勤必备。",
                img: "https://picsum.photos/id/20/500/500",
                isHot: true,
                isNew: false,
                isDiscount: true
            },
            {
                id: "prod_1002",
                name: "极简头层牛皮托特包",
                price: 459.0,
                oldPrice: 0,
                desc: "轻奢质感，大容量收纳，日常百搭。",
                img: "https://picsum.photos/id/26/500/500",
                isHot: true,
                isNew: true,
                isDiscount: false
            },
            {
                id: "prod_1003",
                name: "晨雾森林淡香水",
                price: 189.0,
                oldPrice: 289.0,
                desc: "清冽木质调，留香6小时，限量发售。",
                img: "https://picsum.photos/id/108/500/500",
                isHot: false,
                isNew: true,
                isDiscount: true
            },
            {
                id: "prod_1004",
                name: "云朵蚕丝被四季款",
                price: 599.0,
                oldPrice: 0,
                desc: "母婴级A类面料，轻盈保暖。",
                img: "https://picsum.photos/id/34/500/500",
                isHot: false,
                isNew: false,
                isDiscount: false
            },
            {
                id: "prod_1005",
                name: "山系户外机能马甲",
                price: 279.0,
                oldPrice: 399.0,
                desc: "防风防泼水，多口袋设计。",
                img: "https://picsum.photos/id/29/500/500",
                isHot: true,
                isNew: true,
                isDiscount: true
            }
        ];
    }

    // 加载本地数据
    function loadDataFromStorage() {
        const stored = localStorage.getItem("elegant_shop_db");
        if (stored) {
            productsDatabase = JSON.parse(stored);
            if (!productsDatabase.length) productsDatabase = initDefaultProducts();
        } else {
            productsDatabase = initDefaultProducts();
        }
        saveToLocal(); // 确保写入初始数据
    }

    function saveToLocal() {
        localStorage.setItem("elegant_shop_db", JSON.stringify(productsDatabase));
        updateStatsAndRender();
    }

    // 辅助：生成短id
    function generateId() {
        return 'prod_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }

    // 判断商品是否有折扣展示
    function isDiscountActive(product) {
        return product.isDiscount === true || (product.oldPrice && product.oldPrice > product.price);
    }

    // 筛选逻辑 (前台)
    function getFilteredFrontProducts() {
        let list = [...productsDatabase];
        if (frontKeyword.trim() !== "") {
            const kw = frontKeyword.trim().toLowerCase();
            list = list.filter(p => p.name.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw));
        }
        if (frontFilter === "hot") {
            list = list.filter(p => p.isHot === true);
        } else if (frontFilter === "new") {
            list = list.filter(p => p.isNew === true);
        } else if (frontFilter === "discount") {
            list = list.filter(p => isDiscountActive(p));
        }
        return list;
    }

    // 渲染前台网格 (没有任何分享图标/按钮)
    function renderFrontShop() {
        const gridContainer = document.getElementById("goodsGridFront");
        const filtered = getFilteredFrontProducts();
        if (!filtered.length) {
            gridContainer.innerHTML = `<div class="empty-state"><i class="fas fa-store-slash"></i> 暂无此类商品，管理员可添加新品~</div>`;
            return;
        }
        let html = '';
        for (let prod of filtered) {
            const showOldPrice = (prod.oldPrice && prod.oldPrice > prod.price) ? `<span class="old-price">¥${prod.oldPrice.toFixed(2)}</span>` : '';
            const priceDisplay = prod.price.toFixed(2);
            // 组装角标
            let badgesHtml = '';
            if (prod.isHot) badgesHtml += `<span class="badge hot">🔥 热销</span>`;
            if (prod.isNew) badgesHtml += `<span class="badge new">✨ 新品</span>`;
            if (isDiscountActive(prod)) badgesHtml += `<span class="badge discount">🏷️ 折扣</span>`;
            
            html += `
                <div class="product-card">
                    <div class="card-img-area">
                        <img src="${escapeHtml(prod.img)}" alt="${escapeHtml(prod.name)}" loading="lazy" onerror="this.src='https://picsum.photos/400/400?grayscale'">
                        <div class="badge-stack">${badgesHtml}</div>
                    </div>
                    <div class="card-info">
                        <div class="product-title">${escapeHtml(prod.name)}</div>
                        <div class="price-container">
                            <span class="current-price">¥${priceDisplay}</span>
                            ${showOldPrice}
                        </div>
                        <div class="product-desc">${escapeHtml(prod.desc)}</div>
                    </div>
                </div>
            `;
        }
        gridContainer.innerHTML = html;
    }

    // 渲染后台管理列表（包含编辑删除按钮）
    function renderAdminList() {
        const adminDiv = document.getElementById("adminProductList");
        if (!productsDatabase.length) {
            adminDiv.innerHTML = '<div style="padding: 20px; text-align:center; color:#8eaccc;">暂无商品，点击上方添加吧</div>';
            return;
        }
        let itemsHtml = '';
        productsDatabase.forEach(prod => {
            itemsHtml += `
                <div class="admin-item">
                    <div class="admin-item-info">
                        <strong>${escapeHtml(prod.name)}</strong>  ￥${prod.price.toFixed(2)} 
                        ${prod.isHot ? '🔥' : ''} ${prod.isNew ? '✨' : ''}
                        <span style="font-size:0.7rem; color:#6f9bc0;"> (${prod.id.slice(-6)})</span>
                    </div>
                    <div class="admin-actions">
                        <button class="btn-secondary" onclick="editProductById('${prod.id}')"><i class="fas fa-edit"></i> 编辑</button>
                        <button class="btn-danger" onclick="deleteProductById('${prod.id}')"><i class="fas fa-trash-alt"></i> 删除</button>
                    </div>
                </div>
            `;
        });
        adminDiv.innerHTML = itemsHtml;
        // 更新统计数字
        const hotCount = productsDatabase.filter(p => p.isHot).length;
        const newCount = productsDatabase.filter(p => p.isNew).length;
        const disCount = productsDatabase.filter(p => isDiscountActive(p)).length;
        document.getElementById("statDisplay").innerHTML = `📊 商品总数：${productsDatabase.length} &nbsp;| 🔥热销${hotCount} &nbsp;| ✨新品${newCount} &nbsp;| 🏷️折扣${disCount}`;
    }

    function updateStatsAndRender() {
        renderFrontShop();
        renderAdminList();
    }

    // 保存/更新商品
    function handleSaveOrUpdate(e) {
        e.preventDefault();
        const name = document.getElementById("prodName").value.trim();
        const price = parseFloat(document.getElementById("prodPrice").value);
        const oldPriceRaw = document.getElementById("prodOldPrice").value;
        const oldPrice = oldPriceRaw ? parseFloat(oldPriceRaw) : 0;
        const img = document.getElementById("prodImg").value.trim();
        const desc = document.getElementById("prodDesc").value.trim();
        const isHot = document.getElementById("prodHot").checked;
        const isNew = document.getElementById("prodNew").checked;
        const isDiscountFlag = document.getElementById("prodDiscountFlag").checked;
        
        if (!name || isNaN(price) || price <= 0) {
            alert("请正确填写商品名称和售价");
            return;
        }
        const finalImg = img || `https://picsum.photos/id/${Math.floor(Math.random() * 70) + 30}/500/500`;
        const finalDesc = desc || "精选好物，品质保证。";
        
        if (currentEditId) {
            // 更新模式
            const idx = productsDatabase.findIndex(p => p.id === currentEditId);
            if (idx !== -1) {
                productsDatabase[idx] = {
                    ...productsDatabase[idx],
                    name, price, oldPrice: oldPrice || 0,
                    img: finalImg, desc: finalDesc,
                    isHot, isNew, isDiscount: isDiscountFlag
                };
                alert("商品已更新，好友可见最新内容！");
            }
            currentEditId = null;
        } else {
            // 新增
            const newProduct = {
                id: generateId(),
                name, price, oldPrice: oldPrice || 0,
                img: finalImg, desc: finalDesc,
                isHot, isNew, isDiscount: isDiscountFlag
            };
            productsDatabase.unshift(newProduct);
            alert(`商品“${name}”添加成功，所有访客即刻可见。`);
        }
        saveToLocal();
        clearAdminForm();
        updateStatsAndRender();
    }

    function clearAdminForm() {
        currentEditId = null;
        document.getElementById("productManageForm").reset();
        document.getElementById("prodImg").value = '';
        document.getElementById("prodDesc").value = '';
        document.getElementById("prodHot").checked = false;
        document.getElementById("prodNew").checked = false;
        document.getElementById("prodDiscountFlag").checked = false;
        const saveBtn = document.getElementById("saveProductBtn");
        saveBtn.innerHTML = '<i class="fas fa-save"></i> 添加 / 更新商品';
        saveBtn.style.background = "#1f5e8e";
    }

    // 编辑
    window.editProductById = function(id) {
        const prod = productsDatabase.find(p => p.id === id);
        if (!prod) return;
        currentEditId = id;
        document.getElementById("prodName").value = prod.name;
        document.getElementById("prodPrice").value = prod.price;
        document.getElementById("prodOldPrice").value = prod.oldPrice || '';
        document.getElementById("prodImg").value = prod.img;
        document.getElementById("prodDesc").value = prod.desc;
        document.getElementById("prodHot").checked = prod.isHot;
        document.getElementById("prodNew").checked = prod.isNew;
        document.getElementById("prodDiscountFlag").checked = prod.isDiscount;
        const saveBtn = document.getElementById("saveProductBtn");
        saveBtn.innerHTML = '<i class="fas fa-pen"></i> 更新商品';
        saveBtn.style.background = "#e68a2e";
        window.scrollTo({ top: document.querySelector('.admin-panel').offsetTop - 20, behavior: 'smooth' });
    };
    
    window.deleteProductById = function(id) {
        if (confirm("删除后所有用户将无法看到该商品，确定删除吗？")) {
            productsDatabase = productsDatabase.filter(p => p.id !== id);
            if (currentEditId === id) clearAdminForm();
            saveToLocal();
            updateStatsAndRender();
            alert("已删除，前台同步更新。");
        }
    };

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) { return c; });
    }

    // 绑定前台搜索筛选
    function bindFrontEvents() {
        const searchInput = document.getElementById("frontSearch");
        searchInput.addEventListener("input", (e) => {
            frontKeyword = e.target.value;
            renderFrontShop();
        });
        const filterBtns = document.querySelectorAll("#filterGroupFront .filter-chip");
        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const val = btn.getAttribute("data-filter");
                frontFilter = val;
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderFrontShop();
            });
        });
    }

    // 初始化整个应用
    function init() {
        loadDataFromStorage();
        bindFrontEvents();
        const form = document.getElementById("productManageForm");
        form.addEventListener("submit", handleSaveOrUpdate);
        document.getElementById("clearFormBtn").addEventListener("click", clearAdminForm);
        updateStatsAndRender();
    }

    init();
</script>
</body>
</html>
